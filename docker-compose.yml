services:
  redis:
    image: redis:7-alpine
    container_name: unipus_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - unipus_net

  backend:
    build: ./backend
    container_name: unipus_backend
    restart: unless-stopped
    # 不直接暴露到宿主机，仅通过 nginx 访问
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
      - sqlite_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DATABASE_URL=sqlite:///./data/unipus.db
      - REDIS_URL=redis://redis:6379/0
      - TZ=Asia/Shanghai
      - USE_HTTPS=true
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost}
      - UNIPUS_SECRET=${UNIPUS_SECRET}
      - AES_KEY_PREFIX=${AES_KEY_PREFIX}
      - TASK_ENCRYPTION_KEY=${TASK_ENCRYPTION_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    depends_on:
      - redis
    networks:
      - unipus_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers

  celery_worker:
    build: ./backend
    container_name: unipus_worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DATABASE_URL=sqlite:///./data/unipus.db
      - REDIS_URL=redis://redis:6379/0
      - TZ=Asia/Shanghai
      - USE_HTTPS=true
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost}
      - UNIPUS_SECRET=${UNIPUS_SECRET}
      - AES_KEY_PREFIX=${AES_KEY_PREFIX}
      - TASK_ENCRYPTION_KEY=${TASK_ENCRYPTION_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    depends_on:
      - redis
      - backend
    networks:
      - unipus_net
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  celery_beat:
    build: ./backend
    container_name: unipus_beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DATABASE_URL=sqlite:///./data/unipus.db
      - REDIS_URL=redis://redis:6379/0
      - TZ=Asia/Shanghai
      - USE_HTTPS=true
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost}
      - UNIPUS_SECRET=${UNIPUS_SECRET}
      - AES_KEY_PREFIX=${AES_KEY_PREFIX}
      - TASK_ENCRYPTION_KEY=${TASK_ENCRYPTION_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    depends_on:
      - redis
    networks:
      - unipus_net
    command: celery -A app.tasks.celery_app beat --loglevel=info

  nginx:
    image: nginx:alpine
    container_name: unipus_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-18080}:80"
      - "${HTTPS_PORT:-18443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend
    networks:
      - unipus_net

volumes:
  redis_data:
  sqlite_data:

networks:
  unipus_net:
    driver: bridge
